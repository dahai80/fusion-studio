[package]
name = "env-daemon"
version = "0.1.0"
edition = "2021"
description = "Fusion Studio 环境托管守护进程 — 环境自检、一键修复、依赖管理"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"
libc = "0.2"