name: CI

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 检查 Swift 代码 ─────────────────────────────────
  swift-build:
    name: Swift Build & Test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('FusionStudio/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build (debug)
        # F-I13: pipefail 保 swift build 退出码 (原 | tail -10 吞码 → build 失败也绿)。
        run: set -o pipefail && swift build -c debug 2>&1 | tail -20

      - name: Run tests
        # F-I13: 去 continue-on-error (原测试失败不阻断 CI = 假绿) + pipefail 保 swift test 退出码。
        # 不接 tail: tail -20 在失败时吞掉逐用例 "Test Case ... failed" 行, 只留末尾 Executed 摘要,
        # 看不到哪个用例 fail → 无法定位。pipefail 已保退出码, 全量输出便于定位失败用例。
        run: set -o pipefail && swift test 2>&1

      - name: Build (release)
        # F-I13: pipefail 保退出码 (同上)。
        run: set -o pipefail && swift build -c release 2>&1 | tail -20

  # ─── 代码质量 ─────────────────────────────────────────
  # Services/ 已删 (PR #298, 无本地 Rust 后台服务), Rust fmt/check 步骤移除。
  lint:
    name: Code Quality
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('FusionStudio/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Check Swift build warnings
        run: |
          swift build 2>&1 | grep -E "warning:|error:" || echo "✅ 无警告和错误"

  # ─── 安全检查 ─────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for secrets in code
        run: |
          # 检查常见密钥泄露模式
          ! grep -r "API_KEY\|api_key\|secret_key\|SECRET\|password\|PASSWORD\|token.*=" \
            --include="*.swift" --include="*.rs" --include="*.py" \
            --exclude-dir=.build --exclude-dir=target . 2>/dev/null
          echo "✅ 安全检查通过"

  # ─── 通知 ─────────────────────────────────────────────
  notify:
    name: Notification
    needs: [swift-build, lint]
    if: always() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check build status
        run: |
          echo "Swift Build: ${{ needs.swift-build.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          if [ "${{ needs.swift-build.result }}" = "success" ] && \
             [ "${{ needs.lint.result }}" = "success" ]; then
            echo "✅ 所有检查通过"
          else
            echo "⚠️ 部分检查未通过"
          fi