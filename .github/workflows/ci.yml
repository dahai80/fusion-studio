name: CI

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 检查 Swift 代码 ─────────────────────────────────
  swift-build:
    name: Swift Build & Test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Cache SPM build
        # 审计0831: 去 restore-keys。源码变更致 exact key miss 时, 旧 restore-keys 回落到
        # 其它分支/commit 的 stale .build → 增量编译状态错配 → swift-frontend ICE
        # (error: fatalError 无 file:line, StudioTheme [440/443] 复现)。exact miss = clean build。
        uses: actions/cache@v4
        with:
          path: .build
          key: v2-${{ runner.os }}-spm-${{ hashFiles('FusionStudio/**/*.swift', 'Tests/**/*.swift') }}

      - name: Build (debug)
        # F-I13: pipefail 保 swift build 退出码 (原 | tail -10 吞码 → build 失败也绿)。
        # 审计0830: tail 单独用会吞掉真实 error: 行 → CI-only (Swift 5.10) 编译错无法定位。
        #   tee 全量落盘 (失败时 upload-artifact 供下载定位) + tail -80 控制可见日志量。
        # 审计0831: -j 1 串行编译。clean build (cache miss) 时 -j 2 令 2 个 swift-frontend 并发,
        #   编译至模块末尾 [442/445] 峰值内存超 macOS-14 runner 上限 → swift-frontend OOM
        #   (bare `error: fatalError` 无 stack dump)。-j 1 单进程串行, 峰值减半, 治 clean-build ICE。
        #   增量编译 (cache hit) 时 -j 1 仅重编变更文件, 耗时可接受。
        run: set -o pipefail && swift build -c debug -j 1 2>&1 | tee /tmp/build-debug.log | tail -80

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: /tmp/build-debug.log

      - name: Run tests
        # F-I13: 去 continue-on-error (原测试失败不阻断 CI = 假绿) + pipefail 保 swift test 退出码。
        # 不接 tail: tail -20 在失败时吞掉逐用例 "Test Case ... failed" 行, 只留末尾 Executed 摘要,
        # 看不到哪个用例 fail → 无法定位。pipefail 已保退出码, 全量输出便于定位失败用例。
        run: set -o pipefail && swift test -j 2 2>&1

      - name: Build (release)
        # F-I13: pipefail 保退出码 (同上)。
        # 审计0831: -j 1 同 debug, release 全模块 type-check + 优化峰值内存更高, 串行降峰防 clean-build ICE。
        run: set -o pipefail && swift build -c release -j 1 2>&1 | tail -20

  # ─── 代码质量 ─────────────────────────────────────────
  # Services/ 已删 (PR #298, 无本地 Rust 后台服务), Rust fmt/check 步骤移除。
  lint:
    name: Code Quality
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SPM build
        # 审计0831: 去 restore-keys。源码变更致 exact key miss 时, 旧 restore-keys 回落到
        # 其它分支/commit 的 stale .build → 增量编译状态错配 → swift-frontend ICE
        # (error: fatalError 无 file:line, StudioTheme [440/443] 复现)。exact miss = clean build。
        uses: actions/cache@v4
        with:
          path: .build
          key: v2-${{ runner.os }}-spm-${{ hashFiles('FusionStudio/**/*.swift', 'Tests/**/*.swift') }}

      - name: Check Swift build warnings
        # 审计0831: pipefail + tee。原 `swift build | grep -E "warning:|error:" || echo ✅` 在
        # swift-frontend crash (bare `error: fatalError`) 时: grep 匹配 "error:" → `||` 不触发 →
        # step 绿, 但 build 实际 exit 1。掩码双重危害: (1) CI 假绿 (2) save-always:false 本应
        # 只在 success 存 cache, 掩码令 CQ job success → 存 poisoned .build → Build&Test job
        # restore 该 poison → 增量编译 ICE 循环。pipefail 保 crash 退出码, tee 落盘全量日志。
        run: |
          set -o pipefail
          swift build -j 2 2>&1 | tee /tmp/build-lint.log | grep -E "warning:|error:" || echo "✅ 无警告和错误"

  # ─── 安全检查 ─────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for secrets in code
        run: |
          # 检查常见密钥泄露模式
          ! grep -r "API_KEY\|api_key\|secret_key\|SECRET\|password\|PASSWORD\|token.*=" \
            --include="*.swift" --include="*.rs" --include="*.py" \
            --exclude-dir=.build --exclude-dir=target . 2>/dev/null
          echo "✅ 安全检查通过"

  # ─── 通知 ─────────────────────────────────────────────
  notify:
    name: Notification
    needs: [swift-build, lint]
    if: always() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check build status
        run: |
          echo "Swift Build: ${{ needs.swift-build.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          if [ "${{ needs.swift-build.result }}" = "success" ] && \
             [ "${{ needs.lint.result }}" = "success" ]; then
            echo "✅ 所有检查通过"
          else
            echo "⚠️ 部分检查未通过"
          fi