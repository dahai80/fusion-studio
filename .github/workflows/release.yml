name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Callers: triggered by v* tag push. Affected API: swift build -c release, cargo build, build.sh package/dmg. Data: DMG artifact. User: "修复 Release workflow"
  build-release:
    name: Build Release ${{ github.ref_name }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show versions
        run: |
          swift --version
          rustc --version
          cargo --version

      - name: Build Rust services
        run: |
          cd Services/env-daemon
          cargo build --release 2>&1

      - name: Build SwiftUI app (release)
        run: swift build -c release 2>&1

      - name: Package .app
        run: |
          CONFIGURATION=release ./Scripts/build.sh package 2>&1

      - name: Create DMG
        run: |
          # 释放 runner 磁盘：清理 cargo registry + Swift 包缓存 + release 构建中间产物
          df -h / | tail -1
          rm -rf ~/.cargo/registry ~/.cargo/git 2>/dev/null || true
          rm -rf ~/Library/Caches/org.swift.swiftpm 2>/dev/null || true
          rm -rf .build/release 2>/dev/null || true
          df -h / | tail -1
          ./Scripts/build.sh dmg 2>&1

      - name: List artifacts
        id: artifacts
        run: |
          DMG=$(ls .build/FusionStudio-*-arm64.dmg 2>/dev/null | head -1)
          APP=$(ls -d ".build/Fusion Studio.app" 2>/dev/null | head -1)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          ls -lh .build/ 2>/dev/null

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: FusionStudio-${{ github.ref_name }}-arm64
          path: ${{ steps.artifacts.outputs.dmg }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: FusionStudio-${{ github.ref_name }}-arm64
          path: .artifacts

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG=$(sed -n "/## \[${VERSION}\]/,/## \[/p" FusionStudio/Common/DocGeneratorView.swift | head -20 | grep -v "## \[" | sed 's/^            //' | sed '/^$/d')
          {
            echo "version=$VERSION"
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fusion Studio ${{ github.ref_name }}
          body: |
            # Fusion Studio ${{ github.ref_name }}

            ## 下载

            - [FusionStudio-${{ github.ref_name }}-arm64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/FusionStudio-${{ github.ref_name }}-arm64.dmg)

            ## 系统要求

            - macOS 14+ (Sonoma 或更高)
            - Apple Silicon (M1–M5)

            ## 安装

            1. 下载 DMG 文件
            2. 双击打开
            3. 将 Fusion Studio 拖入 Applications 文件夹
            4. 首次启动时，运行环境自检以安装所有依赖

            ## 更新日志

            ${{ steps.changelog.outputs.changelog }}
          files: |
            .artifacts/*.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
