name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Callers: triggered by v* tag push. Affected API: swift build -c release, cargo build, build.sh package/dmg. Data: DMG artifact. User: "修复 Release workflow"
  build-release:
    name: Build Release ${{ github.ref_name }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show versions
        run: |
          swift --version
          # Services/ 已删 (PR #298, 无本地 Rust 后台服务), 无 Rust toolchain 步骤。

      - name: Run tests (release gate)
        # F-I13: release pipeline 须验全流程 (build+test+dmg+sign)。原 release.yml 不跑测试 = 靠本地构建者手验。
        # pipefail 保 swift test 退出码 (tail 不吞码)。测试挂 → release 阻断。
        run: set -o pipefail && swift test 2>&1 | tail -20

      - name: Build SwiftUI app (release)
        run: swift build -c release 2>&1

      - name: Package .app
        run: |
          CONFIGURATION=release ./Scripts/build.sh package 2>&1

      - name: Create DMG
        run: |
          # 释放 runner 磁盘：清理 cargo registry + Swift 包缓存 + release 构建中间产物
          df -h / | tail -1
          rm -rf ~/.cargo/registry ~/.cargo/git 2>/dev/null || true
          rm -rf ~/Library/Caches/org.swift.swiftpm 2>/dev/null || true
          rm -rf .build/release 2>/dev/null || true
          df -h / | tail -1
          ./Scripts/build.sh dmg 2>&1

      # F-I13: CI 验全流程 — 签名 (gate by vars, 缺凭证跳过不阻断 CI)。
      # 需仓库配 secrets: MACOS_CERTIFICATE_P12 (base64), MACOS_CERTIFICATE_PWD, DEVELOPER_ID
      # + 配 Repository Variable SIGN_ENABLED=true 开启。未配 → 跳过 (DMG 未签名, 用户被 Gatekeeper 拦 — 见审计 F-I13)。
      # F-I13fix: secrets 上下文不允许在 if: 内引用 (GitHub 拒绝整个 workflow = 0 jobs, 见 actionlint)。
      #   改用 vars 上下文 (if: 内合法) 作开关, secrets 仅在 env: 内透传实值。
      - name: Import signing certificate
        if: ${{ vars.SIGN_ENABLED == 'true' }}
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$MACOS_CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$(head -c 32 /dev/urandom | base64)" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PWD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          echo "SIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign .app (codesign + spctl verify)
        if: ${{ vars.SIGN_ENABLED == 'true' }}
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        run: |
          ./Scripts/build.sh sign "$DEVELOPER_ID" 2>&1
          # 重新打 DMG (签名后 app 变更, 旧 DMG 失效)
          rm -f .build/FusionStudio-*-arm64.dmg
          ./Scripts/build.sh dmg 2>&1

      # F-I13: 公证 (gate by vars, 缺凭证跳过)。需 secrets: APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD
      # + Repository Variable NOTARIZE_ENABLED=true 开启。
      - name: Notarize DMG (notarytool + stapler)
        if: ${{ vars.NOTARIZE_ENABLED == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ./Scripts/build.sh notarize "$APPLE_ID" "$APPLE_TEAM_ID" "$APPLE_APP_SPECIFIC_PASSWORD" 2>&1

      - name: Cleanup keychain
        if: ${{ always() && env.SIGN_KEYCHAIN != '' }}
        run: |
          security delete-keychain "$SIGN_KEYCHAIN" 2>/dev/null || true

      - name: List artifacts
        id: artifacts
        run: |
          DMG=$(ls .build/FusionStudio-*-arm64.dmg 2>/dev/null | head -1)
          APP=$(ls -d ".build/Fusion Studio.app" 2>/dev/null | head -1)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          ls -lh .build/ 2>/dev/null

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: FusionStudio-${{ github.ref_name }}-arm64
          path: ${{ steps.artifacts.outputs.dmg }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: FusionStudio-${{ github.ref_name }}-arm64
          path: .artifacts

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 从 README.md Changelog 段提取本版本块 (### v0.1.X 标题到下一个 ### v 标题前)。
          # 旧源 DocGeneratorView.swift 无 ## [VERSION] 格式, 提取恒空 → 改 README.md。
          CHANGELOG=$(sed -n "/^### v${VERSION} /,/^### v[0-9]/p" README.md | sed '1d;$d' | sed '/^$/N;/^\n$/D')
          {
            echo "version=$VERSION"
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fusion Studio ${{ github.ref_name }}
          body: |
            # Fusion Studio ${{ github.ref_name }}

            ## 下载

            - [FusionStudio-${{ github.ref_name }}-arm64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/FusionStudio-${{ github.ref_name }}-arm64.dmg)

            ## 系统要求

            - macOS 14+ (Sonoma 或更高)
            - Apple Silicon (M1–M5)

            ## 安装

            1. 下载 DMG 文件
            2. 双击打开
            3. 将 Fusion Studio 拖入 Applications 文件夹
            4. 首次启动时，运行环境自检以安装所有依赖

            ## 更新日志

            ${{ steps.changelog.outputs.changelog }}
          files: |
            .artifacts/*.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
