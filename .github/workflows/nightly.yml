name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 2:00 (北京时间 10:00)
  workflow_dispatch:       # 手动触发

jobs:
  nightly:
    name: Nightly Build
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          # Services/ 已删 (PR #298, 无本地 Rust 后台服务), 仅 Swift build。
          # 审计0827 #9: set -o pipefail 保退出码, 防 swift build 失败被 tail 吞 (与 ci.yml 对齐)。
          set -o pipefail && swift build -c release 2>&1 | tail -5

      - name: Run tests
        # 审计0827 #9: 删 continue-on-error (假绿 — nightly 是发布前兜底门, 测试挂应阻断) + pipefail 保退出码。
        run: set -o pipefail && swift test 2>&1 | tail -10

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-build-logs
          path: |
            .build/**/*.log
          retention-days: 7