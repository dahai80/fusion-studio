name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 2:00 (北京时间 10:00)
  workflow_dispatch:       # 手动触发

jobs:
  nightly:
    name: Nightly Build
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # OPS-3: gitleaks 全历史扫描需要完整 git 历史

      - name: gitleaks secret scan
        # OPS-3 (审计product-0905 P2): nightly 缺 secret 扫描, 与 ci.yml security job 对齐。
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Build
        run: |
          # Services/ 已删 (PR #298, 无本地 Rust 后台服务), 仅 Swift build。
          # 审计0827 #9: set -o pipefail 保退出码, 防 swift build 失败被 tail 吞 (与 ci.yml 对齐)。
          # OPS-10 (审计product-0906 P3): tail 单独用吞真实 error: 行, 失败无法定位。
          #   tee 全量落盘 (upload-artifact 供下载) + tail -80 控可见日志量 (对齐 ci.yml)。
          set -o pipefail && swift build -c release 2>&1 | tee /tmp/nightly-build.log | tail -80

      - name: Run tests
        # 审计0827 #9: 删 continue-on-error (假绿 — nightly 是发布前兜底门, 测试挂应阻断) + pipefail 保退出码。
        # OPS-10 (审计product-0906 P3): tee 全量落盘 + tail -80, 失败时全日志可定位逐用例 fail 行。
        # 审计0907 P3-14: 加 -j 2 限并行编译作业, 缓解 CI runner 内存压力 (macOS-14 7GB; cold build ~204 用例)。
        run: set -o pipefail && swift test -j 2 2>&1 | tee /tmp/nightly-test.log | tail -80

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-build-logs
          path: |
            .build/**/*.log
            /tmp/nightly-*.log
          retention-days: 7