<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; worker-src blob:;">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e2e; }
        #editor-container { width: 100%; height: 100%; }
        #diff-container { width: 100%; height: 100%; display: none; }
    </style>
</head>
<body>
    <div id="editor-container"></div>
    <div id="diff-container"></div>

    <script src="vs/loader.js"></script>
    <script>
        let editor = null;
        let diffEditor = null;
        let currentMode = 'edit';

        require.config({
            paths: { 'vs': 'vs' }
        });

        require(['vs/editor/editor.main'], function () {
            window.monacoReady = true;

            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: '',
                language: 'plaintext',
                theme: 'vs-dark',
                minimap: { enabled: true },
                fontSize: 13,
                lineNumbers: 'on',
                scrollBeyondLastLine: false,
                automaticLayout: true,
                wordWrap: 'on',
                padding: { top: 8 },
                renderWhitespace: 'selection',
                bracketPairColorization: { enabled: true },
                formatOnPaste: true,
                tabSize: 4
            });

            editor.onDidChangeModelContent(function () {
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.monacoBridge) {
                    window.webkit.messageHandlers.monacoBridge.postMessage(JSON.stringify({
                        type: 'contentChange',
                        content: editor.getValue()
                    }));
                }
            });

            diffEditor = monaco.editor.createDiffEditor(document.getElementById('diff-container'), {
                theme: 'vs-dark',
                fontSize: 13,
                readOnly: true,
                renderSideBySide: true,
                automaticLayout: true,
                scrollBeyondLastLine: false,
                padding: { top: 8 }
            });

            window.webkit.messageHandlers.monacoBridge.postMessage(JSON.stringify({
                type: 'ready'
            }));
        });

        function setContent(content, language) {
            if (!editor) return;
            var lang = language || 'plaintext';
            var model = editor.getModel();
            if (model) {
                monaco.editor.setModelLanguage(model, lang);
                model.setValue(content);
            }
        }

        function getContent() {
            return editor ? editor.getValue() : '';
        }

        function setLanguage(language) {
            if (!editor) return;
            var model = editor.getModel();
            if (model) {
                monaco.editor.setModelLanguage(model, language);
            }
        }

        function showDiff(original, modified, language) {
            if (!diffEditor) return;
            currentMode = 'diff';
            document.getElementById('editor-container').style.display = 'none';
            document.getElementById('diff-container').style.display = 'block';
            diffEditor.setModel({
                original: monaco.editor.createModel(original, language || 'plaintext'),
                modified: monaco.editor.createModel(modified, language || 'plaintext')
            });
        }

        function showEditor() {
            currentMode = 'edit';
            document.getElementById('diff-container').style.display = 'none';
            document.getElementById('editor-container').style.display = 'block';
            if (editor) editor.layout();
        }

        function setTheme(theme) {
            monaco.editor.setTheme(theme || 'vs-dark');
        }

        function applyEdits(edits) {
            if (!editor) return;
            var parsed = typeof edits === 'string' ? JSON.parse(edits) : edits;
            var model = editor.getModel();
            if (!model) return;
            var uri = model.uri;
            var workspaceEdits = parsed.map(function (e) {
                return {
                    resource: uri,
                    edit: {
                        range: new monaco.Range(e.startLine, e.startCol, e.endLine, e.endCol),
                        text: e.text
                    }
                };
            });
            monaco.editor.executeEdits('fusion-apply', workspaceEdits);
        }
    </script>
</body>
</html>
