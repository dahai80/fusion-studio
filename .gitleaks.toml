title = "fusion-studio gitleaks config"

[allowlist]
description = "Allowlist test fixtures and known non-secret dev values"
paths = [
    '''Tests/.*''',
    '''.*/monaco-dist/.*''',
]
regexes = [
    # 本地开发用 MLX api_key (settings.json / env 占位, 非生产密钥)
    '''dahai168''',
    # OPS-4 (审计product-0905 P1): 删除 fg-admin-key allowlist — ARCH-2 已移除硬编码兜底,
    # allowlist 会掩盖未来同模式 secret 泄露, 让 gitleaks 真扫。
    # 测试 fixture 占位 key
    '''sk-test[a-zA-Z0-9-]*''',
    '''test_api_key''',
    # 文档/日志里的脱敏占位
    '''<API_KEY>''',
    '''your-api-key''',
]
