title = "fusion-studio gitleaks config"

[allowlist]
description = "Allowlist test fixtures and known non-secret dev values"
paths = [
    '''Tests/.*''',
    '''.*/monaco-dist/.*''',
]
regexes = [
    # OPS-4 (审计product-0906 P2): 移除全局 dahai168 regex allowlist — 无 path scope 可掩盖真实密钥泄露。
    #   dahai168 仅存于测试 fixture, 上面 paths=['''Tests/.*'''] 已放行 fixture, 全局 regex 多余且危险。
    #   删除让 gitleaks 对源码真扫; 同期删除 fg-admin-key allowlist (审计product-0905)。
    # 测试 fixture 占位 key
    '''sk-test[a-zA-Z0-9-]*''',
    '''test_api_key''',
    # 文档/日志里的脱敏占位
    '''<API_KEY>''',
    '''your-api-key''',
]
